<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Промо — AI в освіті</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F1D1A;--gold:#B28A47;--goldL:#E9D5AE;--dk:#24211E;--dk2:#35302A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#151311;color:#F7F1E7;font-family:Manrope,"Segoe UI",Arial,sans-serif}
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:16px 16px 12px;gap:12px}
  #stage{position:relative;line-height:0;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #cv{display:block;background:#fff}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#24211E;color:#E9D5AE;font:600 16px Manrope,Arial,sans-serif;line-height:1.4}
  #ui{width:min(100%,720px);display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  button,.file,.tg{font:700 14px Manrope,Arial,sans-serif;border-radius:999px;border:1px solid #4a433a;background:#24211E;color:#F7F1E7;padding:9px 16px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:8px}
  button:hover,.file:hover,.tg:hover{border-color:#B28A47}
  button.primary{background:#B28A47;border-color:#B28A47;color:#1F1D1A}
  button.rec{background:#8A6A33;border-color:#8A6A33;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .file input{display:none}
  .tg input{accent-color:#B28A47;width:16px;height:16px;margin:0}
  #seek{flex:1;min-width:160px;accent-color:#B28A47}
  #time{font:600 13px ui-monospace,Consolas,monospace;color:#E9D5AE;min-width:96px;text-align:right}
  .hint{font-size:12.5px;color:#a89f92}
  #status{font-size:12.5px;color:#a89f92;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="loading">Завантаження шрифтів…</div>
  </div>
  <div id="ui">
    <div class="row">
      <button id="play" class="primary">▶ Відтворити</button>
      <input type="range" id="seek" min="0" max="36" step="0.01" value="0">
      <span id="time">00.0 / 36.0</span>
    </div>
    <div class="row">
      <label class="tg"><input type="checkbox" id="music" checked> Музика</label>
      <label class="tg"><input type="checkbox" id="voice" checked> Диктор</label>
      <label class="tg"><input type="checkbox" id="subs" checked> Субтитри</label>
      <label class="file">🎙 Завантажити озвучку<input type="file" id="vo" accept="audio/*" multiple></label>
      <label class="file">🖼 Замінити фото<input type="file" id="ph" accept="image/*"></label>
    </div>
    <div class="row">
      <button id="rec" class="rec">● Записати відео</button>
      <span class="hint">Для Instagram конвертуйте .webm у .mp4 (напр. у CapCut)</span>
    </div>
    <div id="status">Вбудована озвучка диктора. Можна завантажити свою (vo1 … vo7).</div>
  </div>
</div>

function setFont(f, ls = 0) { ctx.font = f; ctx.letterSpacing = ls + 'px'; }
function rr(x, y, w, h, r) { w = Math.max(0, w); ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function bg(col) { ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); }
function drift(t, a, b) {
  const s = 1 + .03 * clamp((t - a) / (b - a));
  ctx.translate(540 + Math.sin(t * .9) * 3, 960 + Math.cos(t * .7) * 3);
  ctx.scale(s, s); ctx.translate(-540, -960);
}
function fitSize(text, fontFn, size, maxW, lsK = -.02) {
  setFont(fontFn(size), size * lsK);
  const w = ctx.measureText(text).width;
  return w > maxW ? size * maxW / w : size;
}
// Рядок із сегментів; сегмент з hl отримує маркерне виділення + scale
function rich(segs, x, y, o) {
  ctx.save();
  setFont(o.font, o.ls || 0); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
  const ws = segs.map(s => ctx.measureText(s.t).width);
  // запас навколо виділюваних слів, щоб маркер і scale не «з'їдали» пробіли
  const ms = segs.map((s, i) => s.hl && segs.length > 1 ? o.size * .1 + ws[i] * .03 : 0);
  const tw = ws.reduce((a, b, i) => a + b + ms[i] * 2, 0);
  let sx = o.align === 'left' ? x : o.align === 'right' ? x - tw : x - tw / 2;
  segs.forEach((s, i) => {
    const w = ws[i]; sx += ms[i]; ctx.save();
    const h = s.hl ? hl(s.hl) : null;
    if (h && h.a > 0) {
      const cx = sx + w / 2, cy = y - o.size * .32;
      ctx.translate(cx, cy); ctx.scale(h.sc, h.sc); ctx.translate(-cx, -cy);
      ctx.save(); ctx.globalAlpha *= h.a * (o.dark ? .3 : .78); ctx.fillStyle = C.goldL;
      const pad = o.size * .08;
      rr(sx - pad, y - o.size * .64, (w + pad * 2) * h.sweep, o.size * .76, o.size * .08); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = s.c || o.color; ctx.fillText(s.t, sx, y);
    ctx.restore(); sx += w + ms[i];
  });
  ctx.restore();
  return tw;
}
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 - Math.PI / 2, rad = i % 2 ? r * .22 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
}
function clock(cx, cy, r, am, ah, alpha, col) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, r1 = r - (i % 3 ? 34 : 64);
    ctx.lineWidth = i % 3 ? 6 : 12; ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * (r - 18), cy + Math.sin(a) * (r - 18)); ctx.stroke();
  }
  ctx.lineWidth = 18; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ah - Math.PI / 2) * r * .48, cy + Math.sin(ah - Math.PI / 2) * r * .48); ctx.stroke();
  ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(am - Math.PI / 2) * r * .8, cy + Math.sin(am - Math.PI / 2) * r * .8); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

const photo = {img:null, glow:null};
function setPhoto(img) {
  photo.img = img; photo.glow = null;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const tc = document.createElement('canvas'); tc.width = 8; tc.height = 8;
  const tx = tc.getContext('2d'); tx.drawImage(img, 0, 0, 8, 8);
  const d = tx.getImageData(0, 0, 8, 8).data;
  if (d[3] < 200 || d[(7 * 8) * 4 + 3] < 200 || d[7 * 4 + 3] < 200) {   // є прозорість → вирізка, робимо золоте світіння
    const g = document.createElement('canvas'); g.width = iw; g.height = ih;
    const gx = g.getContext('2d'); gx.filter = 'blur(' + Math.round(iw / 50) + 'px)'; gx.drawImage(img, 0, 0);
    gx.filter = 'none'; gx.globalCompositeOperation = 'source-in'; gx.fillStyle = C.goldL; gx.fillRect(0, 0, iw, ih);
    photo.glow = g;
  }
}
function drawPerson(x, y, w, h, zoom) {
  const img = photo.img; if (!img) return;
  const iw = img.naturalWidth, ih = img.naturalHeight, ar = w / h;
  let sw, sh; if (iw / ih > ar) { sh = ih; sw = sh * ar; } else { sw = iw; sh = sw / ar; }
  const sx = clamp(iw * .5 - sw / 2, 0, iw - sw), sy = clamp(ih * .22 - sh * .22, 0, ih - sh);
  ctx.save();
  const fx = x + w / 2, fy = y + h * .22;
  ctx.translate(fx, fy); ctx.scale(zoom, zoom); ctx.translate(-fx, -fy);
  if (photo.glow) { ctx.save(); ctx.globalAlpha = .75; ctx.drawImage(photo.glow, sx, sy, sw, sh, x - 8, y - 6, w + 16, h + 12); ctx.restore(); }
  ctx.filter = 'saturate(0.8) contrast(1.06)';
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.filter = 'none';
  ctx.restore();
}
function archPath(x, y, w, h, r, br = 26) {
  ctx.beginPath(); ctx.moveTo(x, y + h - br); ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, 1.5 * Math.PI); ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, 1.5 * Math.PI, 2 * Math.PI); ctx.lineTo(x + w, y + h - br);
  ctx.arcTo(x + w, y + h, x + w - br, y + h, br); ctx.lineTo(x + br, y + h);
  ctx.arcTo(x, y + h, x, y + h - br, br); ctx.closePath();
}

function s1(t) {
  bg(C.white);
  clock(540, 860, 410, t * 9, t * .8, .07, C.ink);

  let k = 0;
  for (const L of S1) {
    let size = L.size;
    const fnt = (w, s) => `${w.it ? 'italic ' : ''}700 ${s}px ${PF}`;
    const measure = s => { let tot = 0; L.w.forEach((w, i) => { setFont(fnt(w, s), -s * .02); tot += ctx.measureText(w.t).width + (i ? s * .26 : 0); }); return tot; };
    let tot = measure(size); if (tot > 900) { size *= 900 / tot; tot = measure(size); }
    let x = 540 - tot / 2;
    L.w.forEach((w, i) => {
      if (i) x += size * .26;
      setFont(fnt(w, size), -size * .02); const ww = ctx.measureText(w.t).width;
      const st = .12 + k * .08, p = P(t, st, .75);
      if (p > 0) {
        const e = eOutBack(p);
        let dy = -760 * (1 - e), rot = (1 - e) * (k % 2 ? .2 : -.2), al = clamp(p * 4);
        const q = eInCubic(P(t, 2.72 + k * .03, .26)); dy += 950 * q; al *= 1 - q;
        const cx = x + ww / 2, cy = L.y - size * .35;
        ctx.save(); ctx.translate(cx, cy + dy); ctx.rotate(rot); ctx.translate(-cx, -cy);
        rich([w], x, L.y, {font:fnt(w, size), size, ls:-size * .02, color:C.ink, align:'left', alpha:al});
        ctx.restore();
      }
      x += ww; k++;

  const timeout = new Promise(r => setTimeout(r, 6000));
  await Promise.race([(async () => { await document.fonts.ready; await Promise.all(loads.map(f => document.fonts.load(f, sample))); await document.fonts.ready; })(), timeout]);
  $('loading').remove(); ready = true; syncUI(); layout();
  requestAnimationFrame(loop);
})();
</script>
</body>
