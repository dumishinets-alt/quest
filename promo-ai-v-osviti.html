<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Промо — AI в освіті</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F1D1A;--gold:#B28A47;--goldL:#E9D5AE;--dk:#24211E;--dk2:#35302A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#151311;color:#F7F1E7;font-family:Manrope,"Segoe UI",Arial,sans-serif}
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:16px 16px 12px;gap:12px}
  #stage{position:relative;line-height:0;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #cv{display:block;background:#fff}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#24211E;color:#E9D5AE;font:600 16px Manrope,Arial,sans-serif;line-height:1.4}
  #ui{width:min(100%,720px);display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  button,.file,.tg{font:700 14px Manrope,Arial,sans-serif;border-radius:999px;border:1px solid #4a433a;background:#24211E;color:#F7F1E7;padding:9px 16px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:8px}
  button:hover,.file:hover,.tg:hover{border-color:#B28A47}
  button.primary{background:#B28A47;border-color:#B28A47;color:#1F1D1A}
  button.rec{background:#8A6A33;border-color:#8A6A33;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .file input{display:none}
  .tg input{accent-color:#B28A47;width:16px;height:16px;margin:0}
  #seek{flex:1;min-width:160px;accent-color:#B28A47}
  #time{font:600 13px ui-monospace,Consolas,monospace;color:#E9D5AE;min-width:96px;text-align:right}
  .hint{font-size:12.5px;color:#a89f92}
  #status{font-size:12.5px;color:#a89f92;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="loading">Завантаження шрифтів…</div>
  </div>
  <div id="ui">
    <div class="row">
      <button id="play" class="primary">▶ Відтворити</button>
      <input type="range" id="seek" min="0" max="36" step="0.01" value="0">
      <span id="time">00.0 / 36.0</span>
    </div>
    <div class="row">
      <label class="tg"><input type="checkbox" id="music" checked> Музика</label>
      <label class="tg"><input type="checkbox" id="voice" checked> Диктор</label>
      <label class="tg"><input type="checkbox" id="subs" checked> Субтитри</label>
      <label class="file">🎙 Завантажити озвучку<input type="file" id="vo" accept="audio/*" multiple></label>
      <label class="file">🖼 Замінити фото<input type="file" id="ph" accept="image/*"></label>
    </div>
    <div class="row">
      <button id="rec" class="rec">● Записати відео</button>
      <span class="hint">Для Instagram конвертуйте .webm у .mp4 (напр. у CapCut)</span>
    </div>
    <div id="status">Вбудована озвучка диктора. Можна завантажити свою (vo1 … vo7).</div>
  </div>
</div>

const FACE_BOX = {x:316, y:148, w:288, h:288};
const face = {v:null, ready:false, mask:null, buf:null};
function initFace() {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = FACE_SRC;
  v.addEventListener('loadeddata', () => { face.ready = true; });
  face.v = v;
  face.buf = document.createElement('canvas'); face.buf.width = FACE_BOX.w; face.buf.height = FACE_BOX.h;
}
function buildFaceMask() {
  const {x, y, w, h} = FACE_BOX, m = document.createElement('canvas'); m.width = w; m.height = h;
  const mx = m.getContext('2d');
  // маска = альфа вирізки, трохи звужена, щоб темний фон фрагмента не давав ореолу
  mx.filter = 'blur(2px)'; mx.drawImage(photo.img, x, y, w, h, 0, 0, w, h); mx.filter = 'none';
  mx.globalCompositeOperation = 'destination-in'; mx.drawImage(photo.img, x, y, w, h, 0, 0, w, h);
  mx.globalCompositeOperation = 'destination-in';
  const g = mx.createRadialGradient(w / 2, h * .52, w * .3, w / 2, h * .52, w * .5);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  mx.fillStyle = g; mx.fillRect(0, 0, w, h);
  face.mask = m;
}
function faceFrame() {   // поточний кадр обличчя з м'якою маскою
  const {w, h} = FACE_BOX, bx = face.buf.getContext('2d');
  bx.globalCompositeOperation = 'source-over'; bx.clearRect(0, 0, w, h);
  bx.drawImage(face.v, 0, 0, w, h);   // доріжка вже обрізана до FACE_BOX
  bx.globalCompositeOperation = 'destination-in'; bx.drawImage(face.mask, 0, 0);
  bx.globalCompositeOperation = 'source-over';
  return face.buf;
}
const faceOn = () => face.ready && photo.embedded && face.mask;
function syncFace(t) {
  if (!face.v || !face.ready) return;
  const v = face.v;
  if (playing) {
    if (v.paused) v.play().catch(() => {});
    if (!v.seeking && Math.abs(v.currentTime - t) > .12) v.currentTime = t;
  } else {
    if (!v.paused) v.pause();
    if (!v.seeking && Math.abs(v.currentTime - t) > .02) v.currentTime = t;
  }
}
function setPhoto(img) {
  photo.img = img; photo.glow = null; photo.embedded = false; face.mask = null;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const tc = document.createElement('canvas'); tc.width = 8; tc.height = 8;
  const tx = tc.getContext('2d'); tx.drawImage(img, 0, 0, 8, 8);
  const d = tx.getImageData(0, 0, 8, 8).data;
  if (d[3] < 200 || d[(7 * 8) * 4 + 3] < 200 || d[7 * 4 + 3] < 200) {   // є прозорість → вирізка, робимо золоте світіння
    const g = document.createElement('canvas'); g.width = iw; g.height = ih;
    const gx = g.getContext('2d'); gx.filter = 'blur(' + Math.round(iw / 50) + 'px)'; gx.drawImage(img, 0, 0);
    gx.filter = 'none'; gx.globalCompositeOperation = 'source-in'; gx.fillStyle = C.goldL; gx.fillRect(0, 0, iw, ih);
    photo.glow = g;
  }
}
function drawPerson(x, y, w, h, zoom) {
  const img = photo.img; if (!img) return;
  const iw = img.naturalWidth, ih = img.naturalHeight, ar = w / h;
  let sw, sh; if (iw / ih > ar) { sh = ih; sw = sh * ar; } else { sw = iw; sh = sw / ar; }
  const sx = clamp(iw * .5 - sw / 2, 0, iw - sw), sy = clamp(ih * .22 - sh * .22, 0, ih - sh);
  ctx.save();
  const fx = x + w / 2, fy = y + h * .22;
  ctx.translate(fx, fy); ctx.scale(zoom, zoom); ctx.translate(-fx, -fy);
  if (photo.glow) { ctx.save(); ctx.globalAlpha = .75; ctx.drawImage(photo.glow, sx, sy, sw, sh, x - 8, y - 6, w + 16, h + 12); ctx.restore(); }
  ctx.filter = 'saturate(0.8) contrast(1.06)';
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  if (faceOn()) {
    const k = w / sw;
    ctx.drawImage(faceFrame(), x + (FACE_BOX.x - sx) * k, y + (FACE_BOX.y - sy) * k, FACE_BOX.w * k, FACE_BOX.h * k);
  }
  ctx.filter = 'none';
  ctx.restore();
}
function archPath(x, y, w, h, r, br = 26) {
  ctx.beginPath(); ctx.moveTo(x, y + h - br); ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, 1.5 * Math.PI); ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, 1.5 * Math.PI, 2 * Math.PI); ctx.lineTo(x + w, y + h - br);
  ctx.arcTo(x + w, y + h, x + w - br, y + h, br); ctx.lineTo(x + br, y + h);
  ctx.arcTo(x, y + h, x, y + h - br, br); ctx.closePath();
}

/* ================= СЦЕНА 1: ГАЧОК (0–3) ================= */
const S1 = [
  {y:640, size:150, w:[{t:'Знову'}, {t:'вечір', hl:'vecir', it:true}]},
  {y:810, size:124, w:[{t:'на'}, {t:'підготовку'}]},
  {y:1010, size:180, w:[{t:'уроку?'}]}
];
function s1(t) {
  bg(C.white);
  clock(540, 860, 410, t * 9, t * .8, .07, C.ink);
  ctx.save(); drift(t, 0, 3);
  let k = 0;
  for (const L of S1) {
    let size = L.size;
    const fnt = (w, s) => `${w.it ? 'italic ' : ''}700 ${s}px ${PF}`;
    const measure = s => { let tot = 0; L.w.forEach((w, i) => { setFont(fnt(w, s), -s * .02); tot += ctx.measureText(w.t).width + (i ? s * .26 : 0); }); return tot; };
    let tot = measure(size); if (tot > 900) { size *= 900 / tot; tot = measure(size); }
    let x = 540 - tot / 2;
    L.w.forEach((w, i) => {
      if (i) x += size * .26;
      setFont(fnt(w, size), -size * .02); const ww = ctx.measureText(w.t).width;
      const st = .12 + k * .08, p = P(t, st, .75);
      if (p > 0) {
        const e = eOutBack(p);
        let dy = -760 * (1 - e), rot = (1 - e) * (k % 2 ? .2 : -.2), al = clamp(p * 4);
        const q = eInCubic(P(t, 2.72 + k * .03, .26)); dy += 950 * q; al *= 1 - q;
        const cx = x + ww / 2, cy = L.y - size * .35;
        ctx.save(); ctx.translate(cx, cy + dy); ctx.rotate(rot); ctx.translate(-cx, -cy);
        rich([w], x, L.y, {font:fnt(w, size), size, ls:-size * .02, color:C.ink, align:'left', alpha:al});
        ctx.restore();
      }
      x += ww; k++;
    });
  }
  ctx.restore();
}

  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, {type:'video/webm'}), url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'promo-ai-v-osviti.webm'; document.body.appendChild(a); a.click(); a.remove();
    vstream.getTracks().forEach(tr => tr.stop());
    recording = false; setStatus('Готово: promo-ai-v-osviti.webm завантажено.'); syncUI();
  };
  recording = true; syncUI(); setStatus('Йде запис… не перемикайте вкладку до кінця ролика.');
  rec.start(250);
  await play();
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const btnPlay = $('play'), seekEl = $('seek'), timeEl = $('time'), btnRec = $('rec');
let dragging = false;
function setStatus(s) { $('status').textContent = s; }
function syncUI() {
  btnPlay.textContent = playing ? '❚❚ Пауза' : '▶ Відтворити';
  [btnPlay, seekEl, btnRec, $('vo'), $('ph')].forEach(el => el.disabled = recording);
  btnRec.textContent = recording ? '● Запис…' : '● Записати відео';
}
btnPlay.onclick = async () => { if (playing) pause(); else await play(); syncUI(); };
seekEl.addEventListener('input', () => { dragging = true; seek(+seekEl.value); });
seekEl.addEventListener('change', () => { dragging = false; });
btnRec.onclick = () => record();
$('music').onchange = e => { musicOn = e.target.checked; if (AC) musicBus.gain.setTargetAtTime(musicOn ? .85 : 0, AC.currentTime, .05); };
$('subs').onchange = e => { subsOn = e.target.checked; };
$('voice').onchange = e => { voiceOn = e.target.checked; if (AC) { voBus.gain.setTargetAtTime(voiceOn ? 1 : 0, AC.currentTime, .03); if (playing) scheduleDuck(AC.currentTime, playhead); } };
$('vo').onchange = async e => {
  ensureAudio();
  const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
  voBufs = []; VO.forEach(v => v.e = v.e0);
  let ok = 0;
  for (let i = 0; i < files.length && i < VO.length; i++) {
    try { voBufs[i] = await AC.decodeAudioData(await files[i].arrayBuffer()); VO[i].e = VO[i].s + voBufs[i].duration; ok++; }
    catch (err) { console.warn('Не вдалося декодувати', files[i].name, err); }
  }
  buildVoEnv();
  setStatus(`Озвучка: ${ok} з ${VO.length} реплік (${files.slice(0, 7).map(f => f.name).join(', ')}).`);
  if (playing) startSources(playhead);
};
$('ph').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { setPhoto(img); setStatus('Фото замінено.'); }; img.src = URL.createObjectURL(f);
};
function layout() {
  const ui = $('ui').getBoundingClientRect().height;
  const aw = Math.max(160, window.innerWidth - 32), ah = Math.max(240, window.innerHeight - ui - 44);
  const s = Math.min(aw / W, ah / H);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', layout);

let ready = false;
function loop() {
  if (playing && AC) {
    let t = Math.max(off, off + (AC.currentTime - t0));
    if (t >= DUR) { t = DUR; playing = false; stopSources(); syncUI(); if (recording) endFrames = 10; }
    playhead = t;
  }
  syncFace(playhead);
  if (ready) render(playhead);
  if (endFrames > 0 && --endFrames === 0) { endFrames = -1; if (rec && rec.state !== 'inactive') rec.stop(); }
  if (!dragging) seekEl.value = playhead;
  timeEl.textContent = playhead.toFixed(1).padStart(4, '0') + ' / 36.0';
  requestAnimationFrame(loop);
}
(async function init() {
  layout();
  const img = new Image(); img.src = PHOTO_SRC;
  try { await img.decode(); setPhoto(img); photo.embedded = true; buildFaceMask(); } catch (e) { console.warn(e); }
  initFace();
  // вбудована озвучка: декодуємо одразу, щоб тайминги підсвічувань і субтитрів знали реальну довжину реплік
  try {
    const dc = new OfflineAudioContext(1, 1, 44100);
    const bufs = await Promise.all(VO_SRC.map(b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return dc.decodeAudioData(u.buffer); }));
    bufs.forEach((b, i) => { voBufs[i] = b; VO[i].e = VO[i].s + b.duration; });
    buildVoEnv();
  } catch (e) { console.warn('Озвучку не декодовано', e); }
  const sample = 'АаБбВвҐґЄєІіЇїЙйЩщЮюЯя Abc 0123456789 ₴ @«»—';
  const loads = ['700 100px "Playfair Display"', '600 100px "Playfair Display"', 'italic 700 100px "Playfair Display"', 'italic 600 100px "Playfair Display"',
    '500 50px Manrope', '600 50px Manrope', '700 50px Manrope', '800 50px Manrope'];
  const timeout = new Promise(r => setTimeout(r, 6000));
  await Promise.race([(async () => { await document.fonts.ready; await Promise.all(loads.map(f => document.fonts.load(f, sample))); await document.fonts.ready; })(), timeout]);
  $('loading').remove(); ready = true; syncUI(); layout();
  requestAnimationFrame(loop);
})();
</script>
