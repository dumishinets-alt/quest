<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Промо — AI в освіті</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F1D1A;--gold:#B28A47;--goldL:#E9D5AE;--dk:#24211E;--dk2:#35302A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#151311;color:#F7F1E7;font-family:Manrope,"Segoe UI",Arial,sans-serif}
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:16px 16px 12px;gap:12px}
  #stage{position:relative;line-height:0;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #cv{display:block;background:#fff}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#24211E;color:#E9D5AE;font:600 16px Manrope,Arial,sans-serif;line-height:1.4}
  #ui{width:min(100%,720px);display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  button,.file,.tg{font:700 14px Manrope,Arial,sans-serif;border-radius:999px;border:1px solid #4a433a;background:#24211E;color:#F7F1E7;padding:9px 16px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:8px}
  button:hover,.file:hover,.tg:hover{border-color:#B28A47}
  button.primary{background:#B28A47;border-color:#B28A47;color:#1F1D1A}
  button.rec{background:#8A6A33;border-color:#8A6A33;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .file input{display:none}
  .tg input{accent-color:#B28A47;width:16px;height:16px;margin:0}
  #seek{flex:1;min-width:160px;accent-color:#B28A47}
  #time{font:600 13px ui-monospace,Consolas,monospace;color:#E9D5AE;min-width:96px;text-align:right}
  .hint{font-size:12.5px;color:#a89f92}
  #status{font-size:12.5px;color:#a89f92;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="loading">Завантаження шрифтів…</div>
  </div>
  <div id="ui">
    <div class="row">
      <button id="play" class="primary">▶ Відтворити</button>
      <input type="range" id="seek" min="0" max="36" step="0.01" value="0">
      <span id="time">00.0 / 36.0</span>
    </div>
    <div class="row">
      <label class="tg"><input type="checkbox" id="music" checked> Музика</label>
      <label class="tg"><input type="checkbox" id="subs" checked> Субтитри</label>
      <label class="file">🎙 Завантажити озвучку<input type="file" id="vo" accept="audio/*" multiple></label>
      <label class="file">🖼 Замінити фото<input type="file" id="ph" accept="image/*"></label>
    </div>
    <div class="row">
      <button id="rec" class="rec">● Записати відео</button>
      <span class="hint">Для Instagram конвертуйте .webm у .mp4 (напр. у CapCut)</span>
    </div>
    <div id="status">Озвучку не завантажено — ролик іде з субтитрами.</div>
  </div>
</div>

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const eInCubic = p => p * p * p;
const eOutCubic = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

let T = 0;            // поточний час кадру (для підсвічувань)
let subsOn = true, musicOn = true;

/* ================= ДИКТОР ================= */
const VO = [
  {s:0.3,  e:2.8,  text:'Знову цілий вечір на підготовку уроку?'},
  {s:7.2,  e:9.0,  text:'Стоп. Є простіший шлях.'},
  {s:15.2, e:19.6, text:'За одну годину складемо ваш план AI для уроків — і перший готовий матеріал.'},
  {s:20.3, e:23.8, text:'Я — Олександр Думишинець, вчитель і тренер з AI в освіті.'},
  {s:24.4, e:27.6, text:'Символічні 359 гривень. Лише 5 місць на тиждень.'},
  {s:28.4, e:31.8, text:'А 18 грудня стартує мій курс «AI в освіті».'},
  {s:32.5, e:35.0, text:'Записуйтесь у Telegram: @sasha_teach.'}
];
VO.forEach(v => v.e0 = v.e);
// [номер репліки, частка тривалості репліки, коли починається виділення]
const CUES = {vecir:[0,.2], stop:[1,0], prost:[1,.45], hour:[2,.06], plan:[2,.42], mat:[2,.74],
  name:[3,.12], pill:[3,.6], price:[4,.04], seats:[4,.6], date:[5,.55], tg:[6,.45]};
function hl(id) {
  const c = CUES[id]; if (!c) return null;
  const v = VO[c[0]]; const s = v.s + c[1] * (v.e - v.s);
  if (T < s) return {a:0, sweep:0, sc:1};
  const sw = eOutCubic(P(T, s, .3));
  const fade = 1 - eOutCubic(P(T, v.e, .45));
  return {a:fade, sweep:sw, sc:1 + .06 * sw * fade};
}

/* ================= МАЛЮВАННЯ: ХЕЛПЕРИ ================= */
function setFont(f, ls = 0) { ctx.font = f; ctx.letterSpacing = ls + 'px'; }
function rr(x, y, w, h, r) { w = Math.max(0, w); ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function bg(col) { ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); }
function drift(t, a, b) {
  const s = 1 + .03 * clamp((t - a) / (b - a));
  ctx.translate(540 + Math.sin(t * .9) * 3, 960 + Math.cos(t * .7) * 3);
  ctx.scale(s, s); ctx.translate(-540, -960);
}
function fitSize(text, fontFn, size, maxW, lsK = -.02) {
  setFont(fontFn(size), size * lsK);
  const w = ctx.measureText(text).width;
  return w > maxW ? size * maxW / w : size;
}
// Рядок із сегментів; сегмент з hl отримує маркерне виділення + scale
function rich(segs, x, y, o) {
  ctx.save();
  setFont(o.font, o.ls || 0); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
  const ws = segs.map(s => ctx.measureText(s.t).width);
  // запас навколо виділюваних слів, щоб маркер і scale не «з'їдали» пробіли
  const ms = segs.map((s, i) => s.hl && segs.length > 1 ? o.size * .1 + ws[i] * .03 : 0);
  const tw = ws.reduce((a, b, i) => a + b + ms[i] * 2, 0);
  let sx = o.align === 'left' ? x : o.align === 'right' ? x - tw : x - tw / 2;
  segs.forEach((s, i) => {
    const w = ws[i]; sx += ms[i]; ctx.save();
    const h = s.hl ? hl(s.hl) : null;

  musicBus = AC.createGain(); musicBus.gain.value = musicOn ? .85 : 0;
  duckG = AC.createGain(); musicBus.connect(duckG); duckG.connect(master);
  voBus = AC.createGain(); voBus.connect(master);
}
function stopSources() { srcs.forEach(s => { try { s.stop(); } catch (e) {} }); srcs = []; }
function startSources(o) {
  stopSources();
  const now = AC.currentTime + .03;
  if (musicBuf) { const s = AC.createBufferSource(); s.buffer = musicBuf; s.connect(musicBus); s.start(now, o); srcs.push(s); }
  VO.forEach((v, i) => {
    const b = voBufs[i]; if (!b || v.s + b.duration <= o) return;
    const s = AC.createBufferSource(); s.buffer = b; s.connect(voBus);
    if (v.s >= o) s.start(now + (v.s - o)); else s.start(now, o - v.s);
    srcs.push(s);
  });
  scheduleDuck(now, o);
  t0 = now; off = o;
}
function scheduleDuck(now, o) {
  const g = duckG.gain, D = Math.pow(10, -10 / 20);
  g.cancelScheduledValues(0);
  const wins = VO.map((v, i) => voBufs[i] ? [v.s, v.s + voBufs[i].duration] : null).filter(Boolean);
  g.setValueAtTime(wins.some(([a, b]) => o >= a && o < b) ? D : 1, now);
  wins.forEach(([a, b]) => {
    if (b <= o) return;
    if (a > o) { g.setValueAtTime(1, now + (a - o)); g.linearRampToValueAtTime(D, now + (a - o) + .15); }
    g.setValueAtTime(D, now + (b - o)); g.linearRampToValueAtTime(1, now + (b - o) + .4);
  });
}
async function play() {
  ensureAudio(); await AC.resume(); await musicPromise;
  if (playhead >= DUR - .01) playhead = 0;
  startSources(playhead); playing = true;
}
function pause() { if (!playing) return; playing = false; stopSources(); }
function seek(v) { playhead = clamp(v, 0, DUR); if (playing) startSources(playhead); }

/* ================= ЗАПИС ================= */
let rec = null, chunks = [], recording = false, endFrames = -1, vstream = null;
async function record() {
  ensureAudio(); await AC.resume(); await musicPromise;
  pause(); playhead = 0; render(0);
  vstream = cv.captureStream(FPS);
  const stream = new MediaStream([...vstream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:10e6, audioBitsPerSecond:192000});
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, {type:'video/webm'}), url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'promo-ai-v-osviti.webm'; document.body.appendChild(a); a.click(); a.remove();
    vstream.getTracks().forEach(tr => tr.stop());
    recording = false; setStatus('Готово: promo-ai-v-osviti.webm завантажено.'); syncUI();
  };
  recording = true; syncUI(); setStatus('Йде запис… не перемикайте вкладку до кінця ролика.');
  rec.start(250);
  await play();
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const btnPlay = $('play'), seekEl = $('seek'), timeEl = $('time'), btnRec = $('rec');
let dragging = false;
function setStatus(s) { $('status').textContent = s; }
function syncUI() {
  btnPlay.textContent = playing ? '❚❚ Пауза' : '▶ Відтворити';
  [btnPlay, seekEl, btnRec, $('vo'), $('ph')].forEach(el => el.disabled = recording);
  btnRec.textContent = recording ? '● Запис…' : '● Записати відео';
}
btnPlay.onclick = async () => { if (playing) pause(); else await play(); syncUI(); };
seekEl.addEventListener('input', () => { dragging = true; seek(+seekEl.value); });
seekEl.addEventListener('change', () => { dragging = false; });
btnRec.onclick = () => record();
$('music').onchange = e => { musicOn = e.target.checked; if (AC) musicBus.gain.setTargetAtTime(musicOn ? .85 : 0, AC.currentTime, .05); };
$('subs').onchange = e => { subsOn = e.target.checked; };
$('vo').onchange = async e => {
  ensureAudio();
  const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
  voBufs = []; VO.forEach(v => v.e = v.e0);
  let ok = 0;
  for (let i = 0; i < files.length && i < VO.length; i++) {
    try { voBufs[i] = await AC.decodeAudioData(await files[i].arrayBuffer()); VO[i].e = VO[i].s + voBufs[i].duration; ok++; }
    catch (err) { console.warn('Не вдалося декодувати', files[i].name, err); }
  }
  setStatus(`Озвучка: ${ok} з ${VO.length} реплік (${files.slice(0, 7).map(f => f.name).join(', ')}).`);
  if (playing) startSources(playhead);
};
$('ph').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { setPhoto(img); setStatus('Фото замінено.'); }; img.src = URL.createObjectURL(f);
};
function layout() {
  const ui = $('ui').getBoundingClientRect().height;
  const aw = Math.max(160, window.innerWidth - 32), ah = Math.max(240, window.innerHeight - ui - 44);
  const s = Math.min(aw / W, ah / H);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', layout);

let ready = false;
function loop() {
  if (playing && AC) {
    let t = Math.max(off, off + (AC.currentTime - t0));
    if (t >= DUR) { t = DUR; playing = false; stopSources(); syncUI(); if (recording) endFrames = 10; }
    playhead = t;
  }
  if (ready) render(playhead);
  if (endFrames > 0 && --endFrames === 0) { endFrames = -1; if (rec && rec.state !== 'inactive') rec.stop(); }
  if (!dragging) seekEl.value = playhead;
  timeEl.textContent = playhead.toFixed(1).padStart(4, '0') + ' / 36.0';
  requestAnimationFrame(loop);
}
(async function init() {
  layout();
  const img = new Image(); img.src = PHOTO_SRC;
  try { await img.decode(); setPhoto(img); } catch (e) { console.warn(e); }
  const sample = 'АаБбВвҐґЄєІіЇїЙйЩщЮюЯя Abc 0123456789 ₴ @«»—';
  const loads = ['700 100px "Playfair Display"', '600 100px "Playfair Display"', 'italic 700 100px "Playfair Display"', 'italic 600 100px "Playfair Display"',
    '500 50px Manrope', '600 50px Manrope', '700 50px Manrope', '800 50px Manrope'];
  const timeout = new Promise(r => setTimeout(r, 6000));
  await Promise.race([(async () => { await document.fonts.ready; await Promise.all(loads.map(f => document.fonts.load(f, sample))); await document.fonts.ready; })(), timeout]);
  $('loading').remove(); ready = true; syncUI(); layout();
  requestAnimationFrame(loop);
})();
</script>
