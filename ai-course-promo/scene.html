<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ШІ в освіті — промо</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ====== ТЕКСТИ (редагуйте тут) ======
const TEXT = {
  hook: 'Освіта змінюється.',
  b1: 'Штучний інтелект — не загроза.',
  b2: 'Це ваш найсильніший асистент.',
  cardsTitle: 'У курсі ви опануєте',
  cards: [
    ['01', 'Уроки за хвилини', 'плани, завдання, презентації'],
    ['02', 'Персоналізація', 'навчання під кожного учня'],
    ['03', 'Оцінювання з ШІ', 'швидкий і чесний фідбек'],
    ['04', 'Етика та безпека', 'відповідальне використання'],
  ],
  kicker: 'АВТОРСЬКИЙ КУРС',
  title: 'ШІ В ОСВІТІ',
  subtitle: 'Практичний курс для вчителів і викладачів',
  cta: 'Реєстрацію відкрито',
};
const DURATION = 15;

// ====== УТИЛІТИ ======
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// in/out вікно видимості: 0..1
function win(t, a, inDur, b, outDur) { return easeOut(prog(t, a, a + inDur)) * (1 - easeIn(prog(t, b - outDur, b))); }
// ключові кадри [[t, v], ...] зі згладжуванням
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t <= t1) return lerp(v0, v1, easeInOut((t - t0) / (t1 - t0)));
  }
  return keys[keys.length - 1][1];
}

// ====== НЕЙРОННА СФЕРА ======
const R = rng(7);
const NODES = 240;
const nodes = [];
for (let i = 0; i < NODES; i++) {
  const y = 1 - (i / (NODES - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
  const jitter = 0.92 + R() * 0.16;
  const u = R() * Math.PI * 2, v = Math.acos(2 * R() - 1), d = 3 + R() * 3;
  nodes.push({
    x: Math.cos(th) * r * jitter, y: y * jitter, z: Math.sin(th) * r * jitter,
    sx: Math.sin(v) * Math.cos(u) * d, sy: Math.cos(v) * d, sz: Math.sin(v) * Math.sin(u) * d,
    delay: R() * 0.9, hue: R(),
  });
}
const edges = [];
for (let i = 0; i < NODES; i++) for (let j = i + 1; j < NODES; j++) {
  const a = nodes[i], b = nodes[j];
  const d = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
  if (d < 0.30) edges.push([i, j, R(), R() < 0.22]);
}
const dust = [];
for (let i = 0; i < 520; i++) dust.push({ x: (R() - .5) * 2400, y: (R() - .5) * 1500, z: R(), s: R(), p: R() * 6.28 });

function drawSphere(t, cx, cy, scale, alpha, form) {
  const ry = t * 0.32 + 0.6, rx = 0.35 + Math.sin(t * 0.4) * 0.12;
  const cyr = Math.cos(ry), syr = Math.sin(ry), cxr = Math.cos(rx), sxr = Math.sin(rx);
  const Rad = 330 * scale, F = 3.2;
  const P = nodes.map(n => {
    const k = easeOutExpo(clamp((form - n.delay * 0.35) / 0.65));
    let x = lerp(n.sx, n.x, k), y = lerp(n.sy, n.y, k), z = lerp(n.sz, n.z, k);
    let x1 = x * cyr - z * syr, z1 = x * syr + z * cyr;
    let y1 = y * cxr - z1 * sxr, z2 = y * sxr + z1 * cxr;
    const p = F / Math.max(F + z2, 0.8);  // частинки біля камери не «перевертаються»
    return { x: cx + x1 * Rad * p, y: cy + y1 * Rad * p, z: z2, p, k, hue: n.hue, hide: F + z2 < 0.8 };
  });
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // внутрішнє сяйво
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rad * 1.5);
  g.addColorStop(0, `rgba(80,140,255,${0.20 * alpha * form})`);
  g.addColorStop(0.5, `rgba(120,70,240,${0.08 * alpha * form})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - Rad * 1.6, cy - Rad * 1.6, Rad * 3.2, Rad * 3.2);
  // зв'язки
  ctx.lineWidth = 1.1 * Math.max(1, scale * 0.8);
  for (const [i, j, s, pulse] of edges) {
    const a = P[i], b = P[j];
    if (a.hide || b.hide) continue;
    const depth = clamp(0.55 - (a.z + b.z) * 0.35, 0.08, 1);
    const al = depth * alpha * Math.min(a.k, b.k) * 0.55;
    if (al < 0.01) continue;
    ctx.strokeStyle = `rgba(90,190,255,${al})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (pulse) {
      const f = (t * 0.9 + s * 7) % 1;
      const px = lerp(a.x, b.x, f), py = lerp(a.y, b.y, f);
      ctx.fillStyle = `rgba(255,220,150,${al * 1.6})`;
      ctx.beginPath(); ctx.arc(px, py, 2.4 * scale, 0, 6.283); ctx.fill();
    }
  }
  // вузли
  for (const p of P) {
    if (p.hide) continue;
    const depth = clamp(0.6 - p.z * 0.4, 0.15, 1);
    const r = (1.6 + depth * 2.4) * p.p * scale;
    const c = p.hue < 0.7 ? '120,200,255' : '190,140,255';
    ctx.fillStyle = `rgba(${c},${depth * alpha * 0.25})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(230,245,255,${depth * alpha})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function drawDust(t, alpha, push) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const d of dust) {
    const z = (d.z + t * 0.03 + push) % 1;           // повільний наїзд камери
    const p = 0.4 + z * 1.8;
    const x = W / 2 + d.x * p * 0.6, y = H / 2 + d.y * p * 0.6;
    const tw = 0.5 + 0.5 * Math.sin(t * 2 + d.p);
    const a = alpha * z * (0.25 + 0.5 * tw) * (1 - z * 0.6);
    ctx.fillStyle = `rgba(170,200,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, (0.6 + d.s * 1.6) * p, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

// ====== ТЕКСТ ======
function spacedWidth(str, sp) { let w = 0; for (const ch of str) w += ctx.measureText(ch).width + sp; return w - sp; }
// по-літерне проявлення з розфокусом
function revealText(str, x, y, { font, color = '#fff', align = 'center', sp = 0, k = 1, out = 0, stagger = 0.5, rise = 30, glow = 0, gradient = null }) {
  if (k <= 0 || out >= 1) return;
  ctx.save();
  ctx.font = font; ctx.textBaseline = 'middle';
  const total = spacedWidth(str, sp);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const chars = [...str], n = chars.length;
  chars.forEach((ch, i) => {
    const local = clamp((k - (i / n) * stagger) / (1 - stagger));
    const e = easeOut(local);
    const a = e * (1 - out);
    const w = ctx.measureText(ch).width;
    if (a > 0.003) {
      const blur = (1 - e) * 14 + out * 18;
      ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
      ctx.globalAlpha = a;
      if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 30; }
      ctx.fillStyle = gradient || color;
      ctx.fillText(ch, cx, y + (1 - e) * rise - out * 10);
    }
    cx += w + sp;
  });
  ctx.restore();
}

// ====== КАРТКИ ======
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawCard(i, t, x, y, w, h) {
  const start = 6.55 + i * 0.32;
  const k = easeOutExpo(prog(t, start, start + 0.9));
  const out = easeIn(prog(t, 9.85 + i * 0.05, 10.45));
  if (k <= 0) return;
  const [num, head, sub] = TEXT.cards[i];
  const s = lerp(0.82, 1, k) * (1 + out * 0.5);
  const ox = (i - 1.5) * out * 140;
  ctx.save();
  ctx.translate(x + w / 2 + ox, y + h / 2 + (1 - k) * 80);
  ctx.scale(s, s);
  ctx.globalAlpha = k * (1 - out);
  const blur = (1 - k) * 12 + out * 16;
  if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
  // скло
  roundRect(-w / 2, -h / 2, w, h, 22);
  const bg = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  bg.addColorStop(0, 'rgba(40,60,110,0.55)'); bg.addColorStop(1, 'rgba(15,20,45,0.55)');
  ctx.fillStyle = bg; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(140,190,255,0.35)'; ctx.stroke();
  // відблиск, що пробігає
  const sweep = prog(t, start + 0.4, start + 1.4);
  if (sweep > 0 && sweep < 1) {
    ctx.save(); roundRect(-w / 2, -h / 2, w, h, 22); ctx.clip();
    const sx = lerp(-w, w, sweep);
    const sg = ctx.createLinearGradient(sx - 80, 0, sx + 80, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,0.18)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.restore();
  }
  // вміст
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const gold = ctx.createLinearGradient(-w / 2, 0, -w / 2 + 120, 0);
  gold.addColorStop(0, '#ffe3a3'); gold.addColorStop(1, '#e0a84a');
  ctx.font = '300 64px "Inter Display", Inter, sans-serif'; ctx.fillStyle = gold;
  ctx.fillText(num, -w / 2 + 36, -h / 2 + 96);
  ctx.fillStyle = 'rgba(140,190,255,0.5)'; ctx.fillRect(-w / 2 + 36, -h / 2 + 122, 50 * k, 2);
  ctx.font = '600 34px "Inter Display", Inter, sans-serif'; ctx.fillStyle = '#f2f6ff';
  ctx.fillText(head, -w / 2 + 36, -h / 2 + 182);
  ctx.font = '400 22px Inter, sans-serif'; ctx.fillStyle = 'rgba(200,215,240,0.75)';
  ctx.fillText(sub, -w / 2 + 36, -h / 2 + 222);
  ctx.restore();
}

// ====== ПОСТОБРОБКА ======
const grains = [];
for (let g = 0; g < 8; g++) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 270;
  const x = c.getContext('2d'), id = x.createImageData(480, 270), rr = rng(100 + g);
  for (let i = 0; i < id.data.length; i += 4) { const v = rr() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); grains.push(c);
}
const BAR = 138; // кадр 2.39:1

function flare(x, y, k, t) {
  if (k <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, 520);
  g.addColorStop(0, `rgba(255,255,255,${k})`); g.addColorStop(0.15, `rgba(170,210,255,${k * 0.6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // анаморфний промінь
  const s = ctx.createLinearGradient(0, y, W, y);
  s.addColorStop(0, 'rgba(60,120,255,0)'); s.addColorStop(.5, `rgba(120,180,255,${k * 0.9})`); s.addColorStop(1, 'rgba(60,120,255,0)');
  ctx.fillStyle = s; ctx.fillRect(0, y - 3 - k * 4, W, 6 + k * 8);
  ctx.globalAlpha = k * 0.5; ctx.fillRect(0, y - 30, W, 60);
  ctx.restore();
}

// ====== КАДР ======
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // фон
  const bg = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H / 2, W * 0.7);
  bg.addColorStop(0, '#0d1430'); bg.addColorStop(0.6, '#060914'); bg.addColorStop(1, '#020308');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // легкий «наїзд» камери на весь кадр
  const zoom = 1 + t * 0.006;
  const shake = Math.max(0, 1 - Math.abs(t - 10.5) * 3) * 6;
  ctx.setTransform(zoom, 0, 0, zoom, W / 2 * (1 - zoom) + Math.sin(t * 90) * shake, H / 2 * (1 - zoom) + Math.cos(t * 77) * shake);

  drawDust(t, kf(t, [[0, 0], [1.5, 1], [13.5, 1], [15, 0]]), t > 10.5 ? (t - 10.5) * 0.12 : 0);

  // сфера: позиція / масштаб / прозорість по сценах
  const form = prog(t, 0.1, 2.8);
  const sx = kf(t, [[0, 960], [3.0, 960], [3.9, 1480], [5.9, 1480], [6.6, 960]]);
  const sy = kf(t, [[0, 540], [6.0, 540], [6.6, 560], [10.2, 560], [10.6, 520]]);
  const sc = kf(t, [[0, 0.9], [3.0, 1.0], [3.9, 1.05], [5.9, 1.1], [6.6, 1.9], [10.2, 2.1], [10.5, 1.0], [15, 1.45]]);
  const sa = kf(t, [[0, 1], [6.0, 1], [6.6, 0.28], [10.2, 0.28], [10.5, 0.8], [11.6, 0.32], [14.2, 0.28], [15, 0]]);
  drawSphere(t, sx, sy, sc, sa, form);

  // ---- Сцена A: гачок
  {
    const k = prog(t, 1.0, 2.2), out = easeIn(prog(t, 2.65, 3.05));
    revealText(TEXT.hook, W / 2, H / 2, { font: '300 104px "Inter Display", Inter, sans-serif', sp: 2, k, out, glow: 'rgba(120,180,255,0.6)' });
  }
  // ---- Сцена B: теза
  {
    const out = easeIn(prog(t, 5.65, 6.15));
    revealText(TEXT.b1, 170, 470, { font: '300 66px "Inter Display", Inter, sans-serif', align: 'left', k: prog(t, 3.25, 4.2), out, color: 'rgba(210,222,245,0.9)' });
    const gg = ctx.createLinearGradient(170, 0, 1150, 0); gg.addColorStop(0, '#ffffff'); gg.addColorStop(1, '#9fd4ff');
    revealText(TEXT.b2, 170, 570, { font: '700 74px "Inter Display", Inter, sans-serif', align: 'left', k: prog(t, 4.0, 5.0), out, gradient: gg, glow: 'rgba(90,170,255,0.45)' });
    const lk = easeOut(prog(t, 4.3, 5.2)) * (1 - out);
    ctx.save(); ctx.fillStyle = `rgba(245,199,107,${lk})`; ctx.fillRect(170, 640, 180 * lk, 3); ctx.restore();
  }
  // ---- Сцена C: що в курсі
  {
    const out = easeIn(prog(t, 9.9, 10.35));
    revealText(TEXT.cardsTitle.toUpperCase(), W / 2, 285, { font: '500 30px Inter, sans-serif', sp: 9, k: prog(t, 6.3, 7.0), out, color: '#f5c76b', rise: 14 });
    const cw = 380, ch = 290, gap = 34, x0 = (W - (cw * 4 + gap * 3)) / 2;
    for (let i = 0; i < 4; i++) drawCard(i, t, x0 + i * (cw + gap), 380, cw, ch);
  }
  // ---- Сцена D: титул
  {
    const dk = easeOut(prog(t, 10.6, 11.8));
    if (dk > 0) {
      const dg = ctx.createRadialGradient(W / 2, 560, 0, W / 2, 560, 760);
      dg.addColorStop(0, `rgba(3,5,14,${0.72 * dk})`); dg.addColorStop(0.6, `rgba(3,5,14,${0.45 * dk})`); dg.addColorStop(1, 'rgba(3,5,14,0)');
      ctx.save(); ctx.translate(W / 2, 560); ctx.scale(1.4, 0.62); ctx.translate(-W / 2, -560);
      ctx.fillStyle = dg; ctx.fillRect(0, -400, W, 1900); ctx.restore();
    }
    const out = 0;
    revealText(TEXT.kicker, W / 2, 360, { font: '500 28px Inter, sans-serif', sp: 14, k: prog(t, 11.0, 11.8), out, color: '#f5c76b', rise: 12 });
    // великий заголовок з «золотим» градієнтом і світловим проблиском
    const tk = prog(t, 10.55, 11.6);
    if (tk > 0) {
      ctx.save();
      const ts = lerp(1.12, 1, easeOutExpo(tk)) + (t - 10.5) * 0.004;
      ctx.translate(W / 2, 505); ctx.scale(ts, ts); ctx.translate(-W / 2, -505);
      const gold = ctx.createLinearGradient(0, 430, 0, 580);
      gold.addColorStop(0, '#fff6dc'); gold.addColorStop(0.45, '#f5c76b'); gold.addColorStop(1, '#b37a2a');
      revealText(TEXT.title, W / 2, 505, { font: '800 168px "Inter Display", Inter, sans-serif', sp: 10, k: tk, stagger: 0.35, rise: 0, gradient: gold, glow: 'rgba(245,190,90,0.35)' });
      // проблиск
      const sw = prog(t, 11.7, 12.9);
      if (sw > 0 && sw < 1) {
        ctx.font = '800 168px "Inter Display", Inter, sans-serif';
        const tw = spacedWidth(TEXT.title, 10);
        const off = document.createElement('canvas'); off.width = W; off.height = 300;
        const o = off.getContext('2d'); o.font = ctx.font; o.textBaseline = 'middle';
        let cx = W / 2 - tw / 2; o.fillStyle = '#fff';
        for (const c of TEXT.title) { o.fillText(c, cx, 150); cx += o.measureText(c).width + 10; }
        o.globalCompositeOperation = 'source-in';
        const bx = lerp(W / 2 - tw / 2 - 200, W / 2 + tw / 2 + 200, easeInOut(sw));
        const sg = o.createLinearGradient(bx - 120, 0, bx + 120, 0);
        sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,0.85)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
        o.fillStyle = sg; o.fillRect(0, 0, W, 300);
        ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(off, 0, 505 - 150);
      }
      ctx.restore();
    }
    // лінія
    const lk = easeOut(prog(t, 11.5, 12.4));
    if (lk > 0) {
      ctx.save();
      const lg = ctx.createLinearGradient(W / 2 - 320, 0, W / 2 + 320, 0);
      lg.addColorStop(0, 'rgba(245,199,107,0)'); lg.addColorStop(.5, 'rgba(245,199,107,0.9)'); lg.addColorStop(1, 'rgba(245,199,107,0)');
      ctx.fillStyle = lg; ctx.fillRect(W / 2 - 320 * lk, 612, 640 * lk, 2); ctx.restore();
    }
    revealText(TEXT.subtitle, W / 2, 668, { font: '400 40px Inter, sans-serif', sp: 1, k: prog(t, 11.8, 12.8), color: 'rgba(225,233,250,0.92)', rise: 18 });
    // CTA-плашка
    const ck = easeOut(prog(t, 12.7, 13.4));
    if (ck > 0) {
      ctx.save(); ctx.globalAlpha = ck;
      ctx.font = '600 30px Inter, sans-serif';
      const label = TEXT.cta.toUpperCase();
      const lw = spacedWidth(label, 5) + 80, bx = W / 2 - lw / 2, by = 760 + (1 - ck) * 20;
      roundRect(bx, by, lw, 66, 33);
      ctx.strokeStyle = 'rgba(245,199,107,0.9)'; ctx.lineWidth = 2; ctx.stroke();
      const pulse = 0.12 + 0.08 * Math.sin(t * 6);
      ctx.fillStyle = `rgba(245,199,107,${pulse})`; ctx.fill();
      ctx.restore();
      revealText(label, W / 2, 760 + (1 - ck) * 20 + 35, { font: '600 30px Inter, sans-serif', sp: 5, k: ck, color: '#fff3d6', rise: 0, stagger: 0.3 });
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none';
  // спалахи на переходах
  flare(W / 2, 505, Math.max(0, 1 - Math.abs(t - 10.5) / 0.45) ** 2 * 1.0, t);
  flare(W / 2, H / 2, Math.max(0, 1 - Math.abs(t - 6.2) / 0.3) ** 2 * 0.35, t);

  // віньєтка
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // зерно плівки
  ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grains[Math.floor(t * 24) % grains.length], 0, 0, W, H); ctx.restore();
  // fade in / out
  const fade = Math.max(1 - prog(t, 0, 0.6), prog(t, 14.2, 15));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  // кінематографічні смуги
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR);
}

window.render = render;
window.DURATION = DURATION;
// у звичайному браузері — програвання в реальному часі
if (!/[?&]capture/.test(location.search)) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
